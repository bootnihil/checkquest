  <text x="325" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="9" fill="#A7B5C9">EXPLORE. <tspan fill="#6EA3FF">INVESTIGATE.</tspan> REPORT.</text>
