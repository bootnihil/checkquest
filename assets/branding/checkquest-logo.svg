      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6D5DFB"/>
    </linearGradient>
    <linearGradient id="quest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7AB8FF"/>
