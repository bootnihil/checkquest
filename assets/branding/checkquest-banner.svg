<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 480" role="img" aria-labelledby="title desc">
  <title id="title">CheckQuest README banner</title>
  <desc id="desc">CheckQuest branding with compass mark and a flowing exploratory QA route across a stylized dark map.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101D"/>
      <stop offset="1" stop-color="#091827"/>
    </linearGradient>

    <linearGradient id="quest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78B7FF"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6A5DF5"/>
    </linearGradient>

    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58C5E9"/>
      <stop offset="0.58" stop-color="#6688FF"/>
      <stop offset="1" stop-color="#FFC14D"/>
    </linearGradient>

    <radialGradient id="mapGlow" cx="0.55" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2A5D8D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0B1C2F" stop-opacity="0"/>
    </radialGradient>

    <filter id="amberGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="480" rx="22" fill="url(#bg)"/>

  <!-- brand copy -->
  <g transform="translate(58 92) scale(.42)">
    <circle cx="256" cy="256" r="158" fill="none" stroke="#9FC7F5" stroke-width="22"/>
    <circle cx="256" cy="256" r="10" fill="#E2F6FF"/>
    <path d="M168 344 L218 219 L344 168 L294 293 Z" fill="url(#quest)"/>
    <path d="M218 219 L256 256 L344 168" fill="none" stroke="#E9FBFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M132 256h28M352 256h28M256 132v28M256 352v28" stroke="#7EA8E4" stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="285" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="112" font-weight="700" letter-spacing="-5" fill="#F7FAFF">
    Check<tspan fill="url(#quest)">Quest</tspan>
  </text>

  <text x="292" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="8" fill="#B6C2D2">
    EXPLORE. <tspan fill="#70A5FF">INVESTIGATE.</tspan> REPORT.
  </text>

  <text x="294" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#D2DAE6">
    AI website tester that explores on its own.
  </text>

  <text x="294" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#8197B0">
    Potential issues. Safe investigation. Evidence-backed reports.
  </text>

  <!-- rounded exploratory map -->
  <g transform="translate(1085 60)">
    <rect x="0" y="0" width="780" height="360" rx="38" fill="#0D2238" stroke="#254662" stroke-width="2"/>
    <rect x="16" y="16" width="748" height="328" rx="28" fill="none" stroke="#335D7E" stroke-opacity=".28"/>

    <rect x="0" y="0" width="780" height="360" rx="38" fill="url(#mapGlow)"/>

    <g fill="#79A8CE" opacity=".14">
      <circle cx="44" cy="40" r="1.2"/><circle cx="74" cy="40" r="1.2"/><circle cx="104" cy="40" r="1.2"/>
      <circle cx="134" cy="40" r="1.2"/><circle cx="164" cy="40" r="1.2"/><circle cx="194" cy="40" r="1.2"/>
      <circle cx="224" cy="40" r="1.2"/><circle cx="254" cy="40" r="1.2"/><circle cx="284" cy="40" r="1.2"/>
      <circle cx="314" cy="40" r="1.2"/><circle cx="344" cy="40" r="1.2"/><circle cx="374" cy="40" r="1.2"/>
      <circle cx="404" cy="40" r="1.2"/><circle cx="434" cy="40" r="1.2"/><circle cx="464" cy="40" r="1.2"/>
      <circle cx="494" cy="40" r="1.2"/><circle cx="524" cy="40" r="1.2"/><circle cx="554" cy="40" r="1.2"/>
      <circle cx="584" cy="40" r="1.2"/><circle cx="614" cy="40" r="1.2"/><circle cx="644" cy="40" r="1.2"/>
      <circle cx="674" cy="40" r="1.2"/><circle cx="704" cy="40" r="1.2"/><circle cx="734" cy="40" r="1.2"/>
    </g>

    <g fill="#123557" stroke="#335E83" stroke-width="2">
      <ellipse cx="98" cy="124" rx="86" ry="61"/>
      <ellipse cx="576" cy="98" rx="92" ry="64"/>
      <ellipse cx="196" cy="270" rx="96" ry="68"/>
      <ellipse cx="612" cy="270" rx="92" ry="66"/>
    </g>

    <g fill="none" stroke="#5D91B7" stroke-width="2" opacity=".28" stroke-linecap="round">
      <path d="M58 121C87 99 132 102 159 126"/>
      <path d="M70 143C99 124 128 125 149 145"/>
      <path d="M533 88C563 67 622 72 651 95"/>
      <path d="M545 111C575 92 615 94 641 115"/>
      <path d="M159 254C188 233 234 235 263 258"/>
      <path d="M575 255C603 234 649 236 675 259"/>
    </g>

    <path d="M112 125
             C238 166 386 170 560 110
             C648 81 699 135 646 188
             C602 232 502 266 312 270
             C234 272 183 291 204 305
             C270 349 452 343 602 283
             C639 269 667 270 694 292"
          fill="none"
          stroke="url(#route)"
          stroke-width="6"
          stroke-linecap="round"
          stroke-dasharray="16 15"/>

    <g fill="none" stroke="#61CBEA" stroke-width="2" opacity=".32">
      <circle cx="112" cy="125" r="22"/>
      <circle cx="562" cy="109" r="22"/>
      <circle cx="204" cy="305" r="23" stroke="#FFC14D"/>
      <circle cx="602" cy="283" r="22"/>
    </g>

    <g stroke-width="3">
      <circle cx="112" cy="125" r="12" fill="#081624" stroke="#75C8EE"/>
      <circle cx="112" cy="125" r="4" fill="#5FD1EB" stroke="none"/>

      <circle cx="562" cy="109" r="12" fill="#081624" stroke="#75C8EE"/>
      <circle cx="562" cy="109" r="4" fill="#5FD1EB" stroke="none"/>

      <circle cx="204" cy="305" r="13" fill="#30291F" stroke="#FFC14D"/>
      <circle cx="204" cy="305" r="5" fill="#FFC14D" stroke="none"/>

      <circle cx="602" cy="283" r="12" fill="#081624" stroke="#75C8EE"/>
      <circle cx="602" cy="283" r="4" fill="#5FD1EB" stroke="none"/>
    </g>

    <g transform="translate(694 292)" filter="url(#amberGlow)">
      <circle r="23" fill="#FFC14D" fill-opacity=".10" stroke="#79C7ED" stroke-width="3"/>
      <path d="M-8-8L8 8M8-8L-8 8" fill="none" stroke="#FFC14D" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g fill="none" stroke="#5A91B8" stroke-width="2" opacity=".28" stroke-linecap="round">
      <path d="M360 88q12-10 24 0q12 10 24 0"/>
      <path d="M382 94q10-8 20 0q10 8 20 0"/>
      <path d="M56 252q16-14 32 0q16 14 32 0"/>
      <path d="M442 296q16-14 32 0q16 14 32 0"/>
      <path d="M670 92q14-12 28 0q14 12 28 0"/>
    </g>

    <g transform="translate(690 70)">
      <circle r="44" fill="#0A1D30" fill-opacity=".70" stroke="#315875"/>
      <circle r="30" fill="none" stroke="#4C7593" stroke-opacity=".45"/>
      <path d="M0-18V18M-18 0H18" stroke="#5381A0" stroke-opacity=".45"/>
      <path d="M-12 12L12-13" stroke="#FFC14D" stroke-width="5" stroke-linecap="round"/>
      <path d="M0 0L16-18" stroke="#58C5E9" stroke-width="5" stroke-linecap="round"/>
      <circle r="5" fill="#D9ECF8"/>
      <text x="0" y="-52" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#7898B0">N</text>
    </g>
  </g>
</svg>
