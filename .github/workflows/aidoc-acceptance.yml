name: External Aidoc Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aidoc:
    name: Aidoc Playwright acceptance
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Aidoc acceptance
        run: npm run test:ui

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aidoc-playwright-report
          path: playwright-report/
          retention-days: 30
